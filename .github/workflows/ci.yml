name: CI

on:
  push:
    branches: [ main, backend, ios, android ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || '' }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tesseract
        if: env.SUPABASE_URL != ''
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run all tests
        run: |
          cd backend
          python -m pytest tests/ -v

      - name: Validate agent contracts
        run: |
          cd backend
          python scripts/validate_agent_contract.py

  admin-portal-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: admin-portal
        run: npm ci

      - name: Lint
        working-directory: admin-portal
        run: npm run lint