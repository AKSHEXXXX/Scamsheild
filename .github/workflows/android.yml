name: Android CI

on:
  push:
    branches: [android, main]
  pull_request:
    branches: [android, main]

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true"
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Detekt (static analysis)
        run: ./gradlew detekt

      - name: Ktlint (formatting check)
        run: ./gradlew ktlintCheck

      - name: Android Lint
        run: ./gradlew lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint-and-format
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        id: test
        run: |
          set +e
          ./gradlew test --no-daemon --max-workers=2 \
            | tee test-output.log
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$TEST_EXIT_CODE" >> $GITHUB_OUTPUT
          exit $TEST_EXIT_CODE

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: |
            app/build/reports/tests/**/*.xml
            app/build/reports/tests/**/*.html
          retention-days: 30

      - name: Check Test Exit Code
        if: always()
        run: exit ${{ needs.test.outputs.exit_code }}

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-format
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          ndk-version: r26c
          cmake-version: 3.22.1
          build-tools-version: 35.0.0

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Assemble Debug
        run: ./gradlew assembleDebug --no-daemon --max-workers=2

      - name: Assemble Release (Unsigned)
        run: ./gradlew assembleRelease --no-daemon --max-workers=2

      - name: Verify Build Artifacts
        run: |
          echo "Debug APK:"
          ls -la app/build/outputs/apk/debug/*.apk
          echo "Release AAB:"
          ls -la app/build/outputs/bundle/release/*.aab

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build-artifacts
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 7

  notify:
    name: Notify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test, build]
    if: always()
    steps:
      - name: Determine Status
        id: status
        run: |
          if [[ "${{ needs.test.result }}" == "success" && "${{ needs.build.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack Notification
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"attachments\": [{
                \"color\": \"${{ steps.status.outputs.color }}\",
                \"title\": \"${{ steps.status.outputs.emoji }} Android CI ${{ steps.status.outputs.status | upper }}\",
                \"fields\": [
                  {\"title\": \"Branch\", \"value\": \"${{ github.ref_name }}\", \"short\": true},
                  {\"title\": \"Commit\", \"value\": \"${{ github.sha }}.\", \"short\": true},
                  {\"title\": \"Workflow\", \"value\": \"${{ github.workflow }}\", \"short\": true},
                  {\"title\": \"Run\", \"value\": \"<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\", \"short\": true}
                ],
                \"footer\": \"${{ github.repository }}\",
                \"ts\": $(date +%s)
              }]
            }" \
            $SLACK_WEBHOOK_URL